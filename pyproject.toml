[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auftragsautomat"
version = "0.1.0"
description = "Auftrags-Automat für Lexware premium: Bestell-PDFs einlesen, gegen den Lexware-Stamm prüfen, freigeben, Einkauf-Bestellung und Verkauf-AB anlegen."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "anthropic>=1.0",
    "rapidfuzz>=3.9",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.38",
    "pandas>=2.2",
    "watchdog>=4.0",
    "requests>=2.31",
    "msal>=1.28",
    "msal-extensions>=1.1",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "reportlab>=4.2",
    "holidays>=0.50",
]

[project.optional-dependencies]
# Nur auf dem Windows-PC mit Lexware installieren:
windows = [
    "pyodbc>=5.1",
    "pywinauto>=0.6.8",
    "extract-msg>=0.48",
    "pywin32>=306",
    "xlwings>=0.31",
]
# Sendungsverfolgung über Browser (öffentliche Track&Trace-Seite / Portal als Rückfall):
tracking = [
    "playwright>=1.45",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
auftragsautomat = "auftragsautomat.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/auftragsautomat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
