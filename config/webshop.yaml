# Konfiguration des Online-Shops (Laden Köln-Süd) mit Lastenrad-Lieferung.
#
# Quelle der Artikel: der Lexware-Artikelstamm der unten genannten Firma (VK Preisgruppe 1, netto).
# `auftragsautomat webshop-export` schreibt daraus website/data/produkte.json und
# website/data/lieferung.json; das Frontend (website/) liest nur diese beiden Dateien.
# `auftragsautomat webshop-server` liefert website/ aus und nimmt Bestellungen unter /api/bestellung an.
# Jede Bestellung landet als JSON unter eingang/webshop/ (für den Auftrags-Automaten) und als
# E-Mail-Entwurf (.eml) unter logs/webshop/mails/. Versand nur, wenn `mail.smtp_host` gesetzt ist.

firma: weinstrasse_agentur         # Lexware-Mandant, aus dem Artikel und Preise kommen
mwst_prozent: 19                   # VK Preisgruppe 1 ist netto -> Shop zeigt brutto
ausgabe_ordner: "website/data"
bestellungen_ordner: "eingang/webshop"
mail_ordner: "logs/webshop/mails"

laden:
  name: "Weinstrasse Köln, Ladengeschäft"
  strasse: "Sachsenring 38"
  plz: "50677"
  ort: "Köln"
  email: "laden@weinstrasseadolph.de"
  oeffnungszeiten:                 # Wochentag 1 = Montag ... 7 = Sonntag; fehlende Tage = geschlossen
    1: ["09:00", "17:00"]
    2: ["09:00", "17:00"]
    3: ["09:00", "17:00"]
    4: ["09:00", "18:30"]
    5: ["09:00", "17:00"]

lieferung:
  mindestflaschen_lastenrad: 12    # ab dieser Flaschenzahl (beliebig gemischt) fährt das Lastenrad
  bestellschluss_uhr: 12           # Bestellungen bis 12 Uhr: Lieferung am nächsten Werktag, sonst übernächster
  tage_voraus: 4                   # so viele Werktage werden als Zeitfenster angeboten
  versandkosten: 6.90              # Paketversand (brutto)
  versandkostenfrei_ab: 120.00
  zonen:
    - id: kern
      name: "Kerngebiet (Südstadt, Neustadt, Altstadt)"
      gebuehr: 0.00
      plz: ["50677", "50676", "50678", "50674", "50667", "50668", "50672"]
    - id: rand
      name: "Angrenzende Veedel"
      gebuehr: 4.90
      plz: ["50670", "50679", "50968", "50969", "50937", "50939", "50931", "50933", "50935", "50996"]
  zeitfenster:
    - { id: vm, von: "10:00", bis: "13:00", tage: [1, 2, 3, 4, 5] }
    - { id: nm, von: "14:00", bis: "17:00", tage: [1, 2, 3, 4, 5] }
    - { id: ab, von: "17:00", bis: "19:00", tage: [4] }        # Feierabend-Lieferung donnerstags

mail:
  smtp_host: null                  # z. B. "smtp.example.org"; null = nur Entwürfe schreiben, nichts senden
  smtp_port: 587
  benutzer: null
  passwort_env: "WEBSHOP_SMTP_PASSWORT"
  absender: null                   # Absenderadresse der Bestellbestätigung; null = laden.email
  empfaenger_laden: null           # wohin die interne Bestellmeldung geht; null = laden.email

