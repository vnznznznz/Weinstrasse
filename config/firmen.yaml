# Die vier Firmen in Lexware premium.
#
# WICHTIG: "lexware_firmenname" muss exakt dem Namen in der Lexware-Firmenauswahl
# entsprechen (Lexware -> Datei -> Firma wechseln). Bitte prüfen und anpassen.
#
# stammdaten.typ: "csv" (Export aus Lexware) oder "odbc" (nur lesender Zugriff auf die
# Lexware-Datenbank). Pfade sind relativ zum Projektordner.
#
# eingang_unterordner: Liegt ein PDF in eingang/<unterordner>/, ist die Firma damit
# vorgegeben. Liegt es direkt in eingang/, wird die Firma über die Kunden-/Lieferanten-
# Aliase bzw. den Stamm ermittelt und in der Freigabe-Ansicht angezeigt.

firmen:
  weinstrasse_agentur:
    name: "Weinstrasse Agentur"
    lexware_firmenname: "Weinstrasse Agentur"
    einkauf_bestellung: false          # hier keine Bestellung im Einkauf
    eingang_unterordner: "weinstrasse_agentur"
    stammdaten:
      typ: csv
      csv:
        artikel: "daten/weinstrasse_agentur/artikel.csv"
        kunden: "daten/weinstrasse_agentur/kunden.csv"
        lieferanten: "daten/weinstrasse_agentur/lieferanten.csv"
        belege: "daten/weinstrasse_agentur/belege.csv"
    opentrans:
      import_ordner: null              # z. B. "C:/Lexware/Shopimport/weinstrasse_agentur"
      lizenziert: null                 # noch zu prüfen
    belegfelder_standard:
      spedition: ""
    meldungen:                           # Intrastat / Schaumweinsteuer / Verpackung (siehe docs/MELDUNGEN.md)
      aktiv: true
      intrastat:
        bundesland: "05"                 # Bestimmungsbundesland (Sitz/Lager): 05 = Nordrhein-Westfalen – prüfen
        ustid: null                      # USt-IdNr. der Firma
        materialnummer_eingang: null     # Destatis-Materialnummer (steht im IDEV-Anschreiben)
        materialnummer_versendung: null
        meldepflichtig_eingang: null     # true/false nach Prüfung der Schwelle (3 Mio. EUR Eingang)
        meldepflichtig_versendung: null  # Schwelle 1 Mio. EUR Versendung
        art_des_geschaefts_standard: "11"
        verkehrszweig_standard: "3"      # Straßenverkehr (LKW)
        statistischer_wert_angeben: true
        frachtzuschlag_prozent: 0        # z. B. 3 = Fracht bis deutsche Grenze pauschal 3 % des Rechnungsbetrags
      schaumwein:
        status: keiner                   # keiner | zertifizierter_empfaenger | registrierter_empfaenger | steuerlager
        verbrauchsteuernummer: null      # Erlaubnis-/Verbrauchsteuernummer vom Hauptzollamt
        hauptzollamt: null               # z. B. "Duisburg"
        steuerentstehung: eingang        # eingang (Empfänger) | entnahme (Steuerlager)
      verpackung:
        systembetreiber: null            # z. B. "Der Grüne Punkt – Duales System Deutschland GmbH"
        vertragsnummer: null
        lucid_registrierungsnummer: null # DE... aus dem Verpackungsregister LUCID
        meldeturnus: jaehrlich           # monatlich | quartal | halbjahr | jaehrlich (laut Systembeteiligungsvertrag)
        nur_inland: true
      bewegungen:
        muster: "daten/{firma}/belegpositionen_{jahr}-{monat:02d}.csv"   # oder .xlsx
        trennzeichen: ";"
        kodierung: "cp1252"
        spalten: {}                      # unser Feldname -> Spaltenname im Lexware-Export, z. B. {belegnummer: "Belegnummer"}

