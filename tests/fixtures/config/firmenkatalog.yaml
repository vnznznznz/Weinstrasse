# Test-Firmenkatalog (Format und Kommentare: siehe config/firmenkatalog.yaml).
# Gleiche Gruppen und Entscheidungen wie in der Produktion, aber nur synthetische Beispiele.
#
# Absichtlich NICHT enthalten sind die Regionsbegriffe "Rhein-Ruhr" und "Zentrale": die Tests der
# Stufe 1 (tests/test_firma.py) benutzen den synthetischen Stammdaten-Kunden "Edeka Zentrale Rhein-Ruhr",
# um die Stammdaten-Stufe der Firmen-Ermittlung zu prüfen; mit diesen Mustern würde der Katalog vorher
# fragen (Region -> WIK LEH oder WOE). Die Katalog-Tests (tests/test_firmenwahl.py) verwenden
# "Minden-Hannover", "Zentraleinkauf" usw.

kundengruppen:
  fachhandel:
    beschreibung: "Fachhandel (Weinhandlungen, Vinotheken, Getränkehandel)"
    firmen: [weinstrasse_agentur, wik_fh_seh]
    entscheidung: lieferant          # welche der beiden Firmen: laut Abschnitt "lieferanten"
    muster: ["Weinhandlung", "Weinhandel", "Vinothek", "Weinkontor", "Weindepot", "Weinladen", "Getränke"]
  eigenstaendiger_leh:
    beschreibung: "Selbständige Lebensmittel-Einzelhändler (eigene Kaufleute)"
    firmen: [wik_fh_seh]
    entscheidung: eindeutig
    muster: ["e.K.", "e. K.", "oHG", "Kaufmann", "Frischemarkt", "Markt GmbH"]
  region:
    beschreibung: "Einkaufsregionen des LEH"
    firmen: [wik_leh, woe_leh]
    entscheidung: fragen             # Tool fragt in der Freigabe und merkt sich die Antwort
    muster: ["Minden-Hannover", "Minden", "Nord", "Südwest", "Nordbayern", "Hessenring", "Südbayern", "Zentrallager", "Region", "Einkaufsregion"]
  kette:
    beschreibung: "Große Supermarktketten"
    firmen: [wik_leh, woe_leh]
    entscheidung: fragen
    muster: ["Spar", "Großhandel", "Grosshandel", "Zentraleinkauf", "Supermarktkette"]
  grosskunde:
    beschreibung: "Großkunden"
    firmen: [wik_leh, woe_leh]
    entscheidung: fragen
    muster: ["Großkunde"]
    kundennummern: ["99001"]         # synthetische Kundennummer laut Dokument

# Fachhandelslieferanten (synthetisch): Lieferant -> Firma.
lieferanten:
  "Weingut Beispiel": wik_fh_seh
  "Cantina Esempio": weinstrasse_agentur
