# Test-Einstellungen: identisch zur Produktion, aber Pfade zeigen in tests/fixtures.
eingang_ordner: "eingang"
archiv_ordner: "archiv"
log_ordner: "logs"
xml_ausgabe_ordner: "logs/opentrans"
dry_run: true
matching:
  schwelle_sicher: 90
  schwelle_kandidat: 60
  standard_volumen_cl: 75
  preis_toleranz_eur: 0.00
  konfidenz_schwelle: 0.80
claude:
  modell: "claude-opus-5-5"
  max_tokens: 16000
  effort: "high"
  api_key_env: "ANTHROPIC_API_KEY"
lexware:
  exe_pfad: null
  fenster_titel_regex: ".*Lexware.*"
  wartezeit_sekunden: 0.0
  maximale_wartezeit_sekunden: 1.0
  screenshots_ordner: "logs/screenshots"
  pdf_ausgabe: keine             # keine | drucker | export  (PDF der Belege; nie Papier, nie E-Mail aus Lexware)
  pdf_drucker: "Microsoft Print to PDF"
  pdf_ausgabe_ordner: "logs/pdf"
# Die echten Alias-Tabellen aus dem Repo verwenden:
alias_ordner: "../../config/aliase"

# ---------------------------------------------------------------- Ausbaustufe 2
m365:
  backend: fake                 # graph | lokal | fake  (graph = empfohlen, braucht App-Registrierung)
  tenant_id: null               # Directory (tenant) ID aus Entra
  client_id: null               # Application (client) ID aus Entra
  postfach: null                # null = angemeldeter Benutzer
  fixtermin_datei:
    web_url: null               # Adresszeile der Fixterminüberwachung.xlsx in SharePoint
    lokaler_pfad: null          # alternativ: OneDrive-synchronisierter Pfad
    blatt: "Fixterminüberwachung"
  kontaktliste_datei:
    web_url: null
    lokaler_pfad: null
  dossier_ordner:
    web_url: null               # Ordner "vorangefertigte Dossiers"
    lokaler_pfad: null

kommunikation:
  absender_name: ""             # erscheint in der Signatur
  absender_email: null
  cc_standard: []
  entwuerfe_ordner: "logs/entwuerfe"

tracking:
  quellen: ["mail", "api", "public_tracking"]   # "portal" nur als Rückfall ergänzen
  chrome_profil: null           # Standard: %LOCALAPPDATA%/Auftragsautomat/chrome-profil
  sichtbar: true

ueberwachung:
  tage_voraus: 21
  mails_rueckblick_tage: 7
  nachfrage_lieferant_werktage: 10
  nachfrage_spedition_werktage: 5
  erneut_nach_werktagen: 2
  bestaetigungen_automatisch_setzen: true
  termine_automatisch_anpassen: false
  bundesland: "NW"

kontakte:
  automatisch_uebernehmen: false
  standard_spedition: "Hillebrand"

dossier:
  ordner_name: "vorangefertigte Dossiers"
  lokaler_ordner: "logs/dossiers"
  gesamt_pdf: false
  verschieben_erlauben: false

# ------------------------------------------- Prozess laut Lexware-Doku, Rabatte, Firmenwahl, Ablage
benennung:
  trenner: " – "
  datumsformat: "%d.%m.%Y"
  kunden_mit_auftragsnummer: ["Spar"]   # WS: "Lieferant – Kunde – Auftragsnummer – Kürzel – Datum"

rabatte:
  aktiv: true
  aktionen_datei:
    web_url: null                 # Aktionszeiträume-Excel in OneDrive/SharePoint
    lokaler_pfad: null
    blatt: "Aktionen"
  rabatt_pdf_ordner: "eingang/rabatte"   # Upload "Rabattliste (PDF)" in der Freigabe-UI
  gedaechtnis_datei: "config/aktionen.yaml"
  automatisch_anwenden: true
  bezug: liefertag
  toleranz_tage: 0

firmenwahl:
  katalog_datei: "config/firmenkatalog.yaml"
  gedaechtnis_datei: "config/firmen_gedaechtnis.yaml"
  merken: true
  fragen_wenn_unklar: true

eingang:
  upload_erlaubt: true          # Freigabe-UI: Auftrag (PDF/MSG/EML/Scan) hochladen -> landet im Eingang
  upload_max_mb: 50
  upload_in_firmen_unterordner: true
  onedrive_ordner:
    web_url: null               # optional: Eingangsordner in OneDrive (Verkäufer legen Aufträge dort ab)
    lokaler_pfad: null          # oder eingang_ordner oben direkt auf den synchronisierten Ordner zeigen lassen
  als_kundenbestellung_ablegen: true   # Eingangsdokument nach Freigabe als "Kd" mit ablegen

ablage:
  aktiv: false                  # einschalten, sobald Ordnerstruktur und Benennung freigegeben sind
  auftraege_ordner:
    web_url: null               # OneDrive: Buchhaltung/Aufträge
    lokaler_pfad: null
  struktur: "1 Eingang"         # alle Aufträge zuerst nach "Aufträge/1 Eingang"; Platzhalter {firma} {jahr} {lieferant} {kunde} möglich
  lokaler_ordner: "logs/ablage"
  nur_scharf: true
